name: CI & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Package - install
        run: flutter pub get

      - name: Package - format
        run: dart format --output=none --set-exit-if-changed .

      - name: Package - analyze
        run: flutter analyze

      - name: Package - test
        run: flutter test

      - name: Example - install, analyze & test
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # The Dart checks above never touch the native code, so a Kotlin, Swift or C
  # error would otherwise reach pub.dev unbuilt. Each platform compiles the
  # example, which links this plugin.
  native:
    name: Build natives (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # `build` is the flutter subcommand plus its flags. It is not always
          # the platform name: Android builds an apk, not an "android".
          - platform: android
            os: ubuntu-latest
            build: apk --debug
          - platform: linux
            os: ubuntu-latest
            build: linux --debug
          # Release, because a debug INSTALL step trips over a googletest PDB
          # copy in the Flutter Windows runner template. The C++ is compiled
          # either way; release is the configuration that completes.
          - platform: windows
            os: windows-latest
            build: windows --release
          - platform: ios
            os: macos-latest
            build: ios --debug --no-codesign
          - platform: macos
            os: macos-latest
            build: macos --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GTK and BlueZ headers the Linux plugin compiles against.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libbluetooth-dev ninja-build cmake pkg-config clang

      - name: Build the example
        working-directory: example
        run: |
          flutter pub get
          flutter build ${{ matrix.build }}

  pana:
    name: Pana score gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # pana validates the pubspec `screenshots` (logo.png) and needs the webp
      # tools (cwebp / gif2webp) to do so.
      - name: Install screenshot tools (webp)
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      # Floor is 140 (the score provable without dartdoc/webp present). With webp
      # installed the screenshot check passes, so CI should report ~150-160. Raise
      # this gate once the real CI score is confirmed.
      - name: Require >= 140 pub points
        run: |
          dart pub global activate pana
          dart pub global run pana --json > pana.json 2> pana.err || true
          POINTS=$(jq -r '.scores.grantedPoints // empty' pana.json)
          MAX=$(jq -r '.scores.maxPoints // empty' pana.json)
          echo "Pana score: ${POINTS:-?}/${MAX:-?}"
          if [ -z "$POINTS" ]; then
            echo "::error::Could not read pana score."; tail -n 50 pana.err; exit 1
          fi
          if [ "$POINTS" -lt 140 ]; then
            echo "::error::pana $POINTS/$MAX is below the required 140, aborting."; exit 1
          fi

  deploy-docs:
    name: Deploy documentation site
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The generator is deterministic, so a rebuild that changes anything
      # means the committed site was not regenerated after a source edit.
      # Catching that here is what stops a page shipping without its rewrite.
      - name: Rebuild the site and check it matches what is committed
        run: |
          python tool/build_docs.py
          if ! git diff --quiet -- site firebase.json; then
            echo "::error::site/ or firebase.json is stale. Run 'python tool/build_docs.py' and commit the result."
            git --no-pager diff --stat -- site firebase.json
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set for this repository, so the documentation site was built and verified but not published. Add the secret to enable deploys."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          set +e
          out=$(npx --yes firebase-tools@latest deploy \
            --only hosting:flutter-classic-bluetooth --project my-pub-packages --non-interactive 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ] && printf '%s' "$out" | grep -q "is the current active version"; then
            echo "Site already serves this build; treating as success."
            exit 0
          fi
          exit "$code"

  version:
    name: Resolve version
    needs: [pana, native]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: v
        name: Is this a new version?
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged; nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new; will tag, then publish."
          fi

  # Push the tag with a PAT so it triggers the Publish workflow; a default
  # GITHUB_TOKEN push would not. Requires the RELEASE_PAT repo secret.
  tag:
    name: Tag release
    needs: version
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create & push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
