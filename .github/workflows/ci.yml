name: CI & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Package - install
        run: flutter pub get

      - name: Package - format
        run: dart format --output=none --set-exit-if-changed .

      - name: Package - analyze
        run: flutter analyze

      - name: Package - test
        run: flutter test

      - name: Example - install, analyze & test
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # The Dart checks above never touch the native code, so a Kotlin, Swift or C
  # error would otherwise reach pub.dev unbuilt. Each platform compiles the
  # example, which links this plugin.
  native:
    name: Build natives (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GTK and BlueZ headers the Linux plugin compiles against.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libbluetooth-dev ninja-build cmake pkg-config clang

      - name: Build the example
        working-directory: example
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --debug ${{ matrix.platform == 'ios' && '--no-codesign' || '' }}

  pana:
    name: Pana score gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # pana validates the pubspec `screenshots` (logo.png) and needs the webp
      # tools (cwebp / gif2webp) to do so.
      - name: Install screenshot tools (webp)
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      # Floor is 140 (the score provable without dartdoc/webp present). With webp
      # installed the screenshot check passes, so CI should report ~150-160. Raise
      # this gate once the real CI score is confirmed.
      - name: Require >= 140 pub points
        run: |
          dart pub global activate pana
          dart pub global run pana --json > pana.json 2> pana.err || true
          POINTS=$(jq -r '.scores.grantedPoints // empty' pana.json)
          MAX=$(jq -r '.scores.maxPoints // empty' pana.json)
          echo "Pana score: ${POINTS:-?}/${MAX:-?}"
          if [ -z "$POINTS" ]; then
            echo "::error::Could not read pana score."; tail -n 50 pana.err; exit 1
          fi
          if [ "$POINTS" -lt 140 ]; then
            echo "::error::pana $POINTS/$MAX is below the required 140, aborting."; exit 1
          fi

  version:
    name: Resolve version
    needs: [pana, native]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: v
        name: Is this a new version?
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged; nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new; will tag, then publish."
          fi

  # Push the tag with a PAT so it triggers the Publish workflow; a default
  # GITHUB_TOKEN push would not. Requires the RELEASE_PAT repo secret.
  tag:
    name: Tag release
    needs: version
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create & push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
